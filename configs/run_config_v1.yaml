# FEP-Latent Dialogue Experiment Config v1
# All methods use this config for reproducibility

# Backbone
model: Qwen/Qwen2.5-7B-Instruct
backend: vllm
temperature: 0.1
top_p: 0.9
max_new_tokens_annotation: 512
max_new_tokens_mcq: 256
max_new_tokens_summary: 512
gpu_memory_utilization: 0.85
tensor_parallel_size: 1

# Data
context_version: 128k
max_history_lines: 200  # long-context / history window cap (PersonaMem baselines)

# Evaluation
n_seeds: 3
retrieval_top_k: 10
max_stm_turns: 50
max_ltm_fields: 20

# PersonaMem split
train_ratio: 0.6
dev_ratio: 0.2
# eval_ratio: 0.2 (implicit)
split_seed: 42

# Annotation
state_annotation_prompt_version: v1
action_label_prompt_version: v1
session_summarizer_version: v1

# Simulator
action_space: [clarify, probe, empathize, challenge, summarize, recommend]
fep_alpha_obs: 0.7       # observation trust weight
fep_pragmatic_weight: 0.5  # pragmatic vs epistemic balance
