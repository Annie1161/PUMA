# MI Phase A (AnnoMI) — align with EXPERIMENT_PLAN / EXPERIMENT_TRACKER
# Primary backbone (plan): Qwen3-7B-Instruct; use Qwen2.5 if Qwen3 weights unavailable on cluster.
model: Qwen/Qwen2.5-7B-Instruct
backend: vllm
temperature: 0.1
top_p: 0.9
max_new_tokens: 256
batch_size: 4
gpu_memory_utilization: 0.85
tensor_parallel_size: 1

# Data
annomi_csv: data/AnnoMI-full.csv
manifest: artifacts/annomi/data_split_manifest.json
train_ratio: 0.7
dev_ratio: 0.15
split_seed: 42

# Runs
n_seeds: 3
seeds: [42, 43, 44]
